# =============================================================================================
# Test profile - hermetic: H2 in memory, in-process cache, in-process events, no external services.
# Testcontainers-backed PostgreSQL coverage lives in PostgresIT (skipped when Docker is absent).
# =============================================================================================
spring:
  datasource:
    url: jdbc:h2:mem:tuneflow-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
  main:
    banner-mode: off
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4

tuneflow:
  jwt:
    secret: integration-test-secret-key-value-that-is-long-enough
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  cache:
    provider: caffeine
  events:
    enabled: true
    publisher: noop          # in-process fan-out: no Kafka required for tests
  storage:
    provider: local
    local-base-path: ./target/test-media
  security:
    expose-reset-token: true
  rate-limit:
    # Disabled so the broad integration journey cannot trip the login limiter.
    enabled: false
  seed:
    enabled: true
    demo-users: true

logging:
  level:
    root: WARN
    com.tuneflow: INFO
    org.hibernate: WARN
    org.springframework: WARN
