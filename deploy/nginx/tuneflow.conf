# =============================================================================================
# TuneFlow API gateway (docs sections 5, 33).
#
# Nginx terminates TLS, applies a coarse first-line rate limit for unauthenticated traffic,
# and proxies to the stateless backend nodes. Fine-grained per-user limits stay in the
# application (RateLimitFilter), because only it knows who the caller is.
# =============================================================================================

upstream tuneflow_backend {
    # Stateless nodes: add one line per replica (or resolve a DNS name with multiple A records).
    server backend:8080 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# Coarse guard for abusive clients before they reach the application.
limit_req_zone $binary_remote_addr zone=tuneflow_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tuneflow_auth:10m rate=1r/s;

server {
    listen 80;
    server_name api.tuneflow.example;

    client_max_body_size 110m;          # matches spring.servlet.multipart.max-request-size
    client_body_timeout 60s;

    # Security headers (docs section 30)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Health/liveness for the load balancer - never rate limited.
    location /actuator/health {
        proxy_pass http://tuneflow_backend;
        access_log off;
    }

    # Login/registration: strict per-IP limit. TuneFlow applies its own 5/minute policy per
    # account/IP on top of this.
    location /api/v1/auth/ {
        limit_req zone=tuneflow_auth burst=5 nodelay;
        proxy_pass http://tuneflow_backend;
        include /etc/nginx/proxy_params_tuneflow;
    }

    location /api/v1/ {
        limit_req zone=tuneflow_api burst=60 nodelay;
        proxy_pass http://tuneflow_backend;
        include /etc/nginx/proxy_params_tuneflow;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=tuneflow_api burst=60 nodelay;
        proxy_pass http://tuneflow_backend;
        include /etc/nginx/proxy_params_tuneflow;
    }
}

# Media is NOT proxied through this gateway in production: the backend issues short-lived
# signed URLs and clients fetch audio/artwork straight from object storage or the CDN
# (docs sections 17, 33, 39).
