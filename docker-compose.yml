# =============================================================================================
# TuneFlow - local development environment.
#
#   docker compose up -d postgres redis kafka              # infrastructure only
#   docker compose --profile app up -d                  # + the backend container
#
# MinIO is removed (its public images are no longer pullable); the backend uses local storage.
# =============================================================================================
name: tuneflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: tuneflow-postgres
    environment:
      POSTGRES_DB: tuneflow
      POSTGRES_USER: tuneflow
      POSTGRES_PASSWORD: tuneflow
      # Deterministic collation so ORDER BY behaves identically across environments.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuneflow -d tuneflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tuneflow-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    container_name: tuneflow-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Optional, off by default. Enable with: docker compose --profile search up -d elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: tuneflow-elasticsearch
    profiles: ["search"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tuneflow/backend:1.0.0
    container_name: tuneflow-backend
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TUNEFLOW_DB_URL: jdbc:postgresql://postgres:5432/tuneflow
      TUNEFLOW_DB_USERNAME: tuneflow
      TUNEFLOW_DB_PASSWORD: tuneflow
      # Development-only secret; override with a real one outside local use.
      TUNEFLOW_JWT_SECRET: local-development-secret-key-please-change-me-32bytes
      TUNEFLOW_CACHE_PROVIDER: redis
      TUNEFLOW_REDIS_HOST: redis
      TUNEFLOW_EVENTS_PUBLISHER: kafka
      TUNEFLOW_KAFKA_BOOTSTRAP: kafka:9092
      TUNEFLOW_STORAGE_PROVIDER: local
      TUNEFLOW_MEDIA_PATH: /app/data/media
      TUNEFLOW_CORS_ORIGINS: "*"
    ports:
      - "8080:8080"
    volumes:
      - backend-media:/app/data/media
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  es-data:
  backend-media: